version: 1
status: starter
app_types:
  - name: rune-db
    summary: Experimental standalone Rune DB host for persistent key/value documents, atomic intent packets and durable streams.
    behavior:
      - "source names an embedded rune-db @DataSource; the same provider can be imported into an ordinary REST app."
      - "POST /v1/execute accepts JSON or MessagePack; values and changes commit atomically in redb."
      - "Default loopback serving; non-loopback binds require token_env authentication."
    sources:
      - src/storage/
      - knowledge/runtime/storage.md
      - examples/data/storage/db-server.rune
  - name: vect-event
    summary: Experimental standalone host restricted to durable event append and replay/tail operations.
    behavior:
      - "source names a vect-event @DataSource whose store is a rune-db provider."
      - "Uses the same transaction engine and HTTP operation protocol as rune-db."
    sources:
      - src/storage/
      - examples/data/storage/event-server.rune
  - name: pixel-3d
    summary: Pixel-art first-person games using shared Rune logic and browser or native raycasting.
    behavior:
      - "Unreleased @Scene world binds solid voxel occupancy from state. Seeded biome generation, box fill/carving, mining, gravity, jumping and elevation are opt-in; legacy grid games are unchanged."
      - "Voxel scenes share JavaScript rendering in browser and QuickJS native windows, with per-pixel model depth and camera pitch; the Rust rasterizer remains grid-only."
      - "@Map floor and ceiling accept opaque hex colors or compiled @Texture names."
      - "@Texture pixels accepts literal rows or row/runs/pattern objects with repeat; named run patterns compress source and expand losslessly at compile time."
      - "@Map ceiling_height sets uniform wall and ceiling elevation in world tiles, default 1, greater than 0.5 and at most 16; floor and collision remain unchanged."
      - "@Map sky generates a seeded, animated gradient and cloud panorama instead of a ceiling."
      - "@Model describes palette-colored boxes; scene things can reference a model with position, rotation and scale. Models are visual-only, not collision geometry."
      - "Model instances accept dissolve from 0 to 1, discarding deterministic pixel fragments without writing depth; default zero preserves solid rendering."
      - "Sky and ceiling are mutually exclusive; floors and ceilings are map-wide horizontal visual planes."
      - "@Scene presentation provides non-shooter HUD and status wording; persistence saves a declared state field."
      - "@Scene ui binds structured resource meters, objectives, notices and highlighted choice panels in browser and native HUDs."
      - "@Scene pause_ui binds a portable pause HUD; restart_action invokes a declared action from paused play; click_to_start=false makes browser menu clicks/taps focus-only."
      - "Shell data-pixel-paused shows paused-play controls; data-pixel-restart invokes the configured restart action and data-pixel-pause resumes."
      - "Browser shell action buttons accept JSON data-pixel-args; game-state text, disabled and selected bindings keep controls current. Action invocation preserves pause."
    sources:
      - src/apps/pixel3d/
      - runtime/rune-web/src/pixel3d/
      - examples/games/rune_crypt/
      - examples/games/rune_miners/
      - knowledge/runtime/pixel3d.md
      - knowledge/runtime/voxel-worlds.md
  - name: REST
    summary: HTTP application mode for route-oriented APIs and optional Swagger output.
    sources:
      - src/apps/rest/
      - examples/api/user_api.rune
  - name: GraphQL
    summary: GraphQL application mode.
    sources:
      - src/apps/graphql/
      - examples/api/book_graphql.rune
  - name: dynamic-ai-web
    summary: Experimental descriptive websites and JSON endpoints generated by Ollama, Codex CLI, or Copilot CLI.
    behavior:
      - "@App type = dynamic-ai-web selects the native AI HTTP server; engine defaults to ollama."
      - "@Site, @Content, and @Data describe public content; @Page declares HTML routes and @Route/METHOD /path declares JSON APIs."
      - "Requests supply path parameters, query and JSON body; headers, cookies, App settings and filesystem paths are not supplied to the model."
      - "Successful pages use the reusable native TtlCache module for bounded, configurable caching; API responses are generated afresh."
      - "Browser cache misses show a Vectrune thinking page before fetching the generated document; raw requests preserve direct output and status codes."
      - "Server Info logs report request IDs, route templates, generation timings and cache hits without request body or query values."
      - "Generation is bounded by timeout, request/output limits and concurrency; CLI adapters use generation-only options in temporary workspaces."
      - "HTML query controls generation=key and cache=off provide immutable disk snapshots and fresh previews; API query parameters are unchanged."
      - "response_target_seconds is advisory prompt guidance, while timeout_seconds enforces the generation deadline."
      - "Responses are generated data, without persistent mutations or transaction execution. JSON syntax is validated; semantic correctness is model-dependent."
    sources:
      - src/apps/dynamic_ai_web/
      - examples/rune-web/dynamic_ai_web.rune
      - tests/dynamic_ai_web.rs
      - tests/dynamic_ai_cli.rs
  - name: WebSocket
    summary: Real-time websocket handling through dedicated sections and websocket builtins.
    behavior:
      - "@Websocket /path defines on_connect, on_disconnect, and on_message handlers"
      - "@Event /path /event-type defines JSON-based event handlers (checks message.type field)"
      - "ws.id builtin retrieves the connection UUID"
      - "ws.broadcast /path message sends to all connections on that path"
      - "ws.send /path connection_id message sends to a specific connection; the connection id may be passed directly or via a context variable"
    sources:
      - src/apps/rest/ws.rs
      - src/builtins/builtin/ws.rs
      - examples/games/worm_game/worm_game.rune
  - name: Frontend Static Hosting
    summary: "Frontend hosting through `@Frontend` configuration."
    behavior:
      - "`@Frontend type = static` serves files from the configured `src` path"
      - "`vectrune app.rune -o html --path <route>` can print rendered HTML for `@Frontend type = static` by resolving the requested route to an HTML file under the configured `src` path"
      - "`@Frontend type = rune-web` normalizes `@Page`, `@Style`, and `@Logic` sections and mounts frontend output at the configured frontend path"
      - "`vectrune app.rune -o html --path <route>` can print server-side rendered HTML for `@Frontend type = rune-web` when the requested route matches the configured frontend mount path"
      - "`rune-web` is currently a frontend mode mounted through REST routing, not a separate `@App type`"
    sources:
      - src/apps/rest/mod.rs
      - src/apps/rune_web/
      - src/main.rs
      - teaching_website/teaching.rune
      - vectrune_docs.rune
  - name: AWS Lambda Packaging/Runtime
    summary: Lambda-aware packaging and runtime entry flow through CLI tooling and Lambda runtime support.
    sources:
      - src/main.rs
      - src/lambda_main.rs
      - src/lambda_main/
notes:
  - The exact section syntax and behavior for each app type should be expanded over time.
  - Keep this file aligned with examples and runtime implementation.
  - WebSocket Event handlers are matched by normalizing section paths (e.g., @Event /ws /join becomes ["Event", "ws", "join"])
