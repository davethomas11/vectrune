version: 1
status: starter
app_types:
  - name: REST
    summary: HTTP application mode for route-oriented APIs and optional Swagger output.
    sources:
      - src/apps/rest/
      - examples/user_api.rune
  - name: GraphQL
    summary: GraphQL application mode.
    sources:
      - src/apps/graphql/
      - examples/book_graphql.rune
  - name: dynamic-ai-web
    summary: Experimental descriptive websites and JSON endpoints generated by Ollama, Codex CLI, or Copilot CLI.
    behavior:
      - "@App type = dynamic-ai-web selects the native AI HTTP server; engine defaults to ollama."
      - "@Site, @Content, and @Data describe public content; @Page declares HTML routes and @Route/METHOD /path declares JSON APIs."
      - "Requests supply path parameters, query and JSON body; headers, cookies, App settings and filesystem paths are not supplied to the model."
      - "Successful pages use the reusable native TtlCache module for bounded, configurable caching; API responses are generated afresh."
      - "Browser cache misses show a Vectrune thinking page before fetching the generated document; raw requests preserve direct output and status codes."
      - "Server Info logs report request IDs, route templates, generation timings and cache hits without request body or query values."
      - "Generation is bounded by timeout, request/output limits and concurrency; CLI adapters use generation-only options in temporary workspaces."
      - "Responses are generated data, without persistent mutations or transaction execution. JSON syntax is validated; semantic correctness is model-dependent."
    sources:
      - src/apps/dynamic_ai_web/
      - examples/dynamic_ai_web.rune
      - tests/dynamic_ai_web.rs
      - tests/dynamic_ai_cli.rs
  - name: WebSocket
    summary: Real-time websocket handling through dedicated sections and websocket builtins.
    behavior:
      - "@Websocket /path defines on_connect, on_disconnect, and on_message handlers"
      - "@Event /path /event-type defines JSON-based event handlers (checks message.type field)"
      - "ws.id builtin retrieves the connection UUID"
      - "ws.broadcast /path message sends to all connections on that path"
      - "ws.send /path connection_id message sends to a specific connection; the connection id may be passed directly or via a context variable"
    sources:
      - src/apps/rest/ws.rs
      - src/builtins/builtin/ws.rs
      - examples/worm_game/worm_game.rune
  - name: Frontend Static Hosting
    summary: "Frontend hosting through `@Frontend` configuration."
    behavior:
      - "`@Frontend type = static` serves files from the configured `src` path"
      - "`vectrune app.rune -o html --path <route>` can print rendered HTML for `@Frontend type = static` by resolving the requested route to an HTML file under the configured `src` path"
      - "`@Frontend type = rune-web` normalizes `@Page`, `@Style`, and `@Logic` sections and mounts frontend output at the configured frontend path"
      - "`vectrune app.rune -o html --path <route>` can print server-side rendered HTML for `@Frontend type = rune-web` when the requested route matches the configured frontend mount path"
      - "`rune-web` is currently a frontend mode mounted through REST routing, not a separate `@App type`"
    sources:
      - src/apps/rest/mod.rs
      - src/apps/rune_web/
      - src/main.rs
      - teaching_website/teaching.rune
      - vectrune_docs.rune
  - name: AWS Lambda Packaging/Runtime
    summary: Lambda-aware packaging and runtime entry flow through CLI tooling and Lambda runtime support.
    sources:
      - src/main.rs
      - src/lambda_main.rs
      - src/lambda_main/
notes:
  - The exact section syntax and behavior for each app type should be expanded over time.
  - Keep this file aligned with examples and runtime implementation.
  - WebSocket Event handlers are matched by normalizing section paths (e.g., @Event /ws /join becomes ["Event", "ws", "join"])
