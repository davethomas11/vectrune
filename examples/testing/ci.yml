name: Rune checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vectrune 0.3.2
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/davethomas11/vectrune/releases/download/v0.3.2/vectrune-linux-x86_64.tar.gz --output "$RUNNER_TEMP/vectrune.tar.gz"
          tar -xzf "$RUNNER_TEMP/vectrune.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/vectrune"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: vectrune doctor .
      - run: vectrune fmt . --check
      - run: vectrune check . --deny-warnings
      - run: vectrune test . --json
