name: Rune Mobile prototype

on:
  pull_request:
    paths:
      - 'runtime/rune-mobile/**'
      - 'runtime/rune-web/**'
      - 'examples/rune_mobile/**'
      - 'tests/browser/rune_mobile.py'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/rune-web/package-lock.json
            runtime/rune-mobile/package-lock.json
      - run: npm ci && npm run build
        working-directory: runtime/rune-web
      - run: npm ci && npm test && npm run build && npx cap sync
        working-directory: runtime/rune-mobile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium webkit
      - run: python tests/browser/rune_mobile.py
      - uses: actions/upload-artifact@v4
        with:
          name: rune-mobile-web
          path: runtime/rune-mobile/www/

  android:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: rune-mobile-web
          path: runtime/rune-mobile/www/
      - run: npm ci && npx cap sync android
        working-directory: runtime/rune-mobile
      - run: ./gradlew assembleDebug
        working-directory: runtime/rune-mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: rune-mobile-android-debug
          path: runtime/rune-mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: rune-mobile-web
          path: runtime/rune-mobile/www/
      - run: npm ci && npx cap sync ios
        working-directory: runtime/rune-mobile
      - run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: runtime/rune-mobile
