name: Rune Mobile Web prototype

on:
  pull_request:
    paths:
      - 'runtime/rune-mobile-web/**'
      - 'runtime/rune-web/**'
      - 'examples/rune_mobile_web/**'
      - 'tests/browser/rune_mobile_web.py'
      - 'tests/mobile_web_cli.rs'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/rune-web/package-lock.json
            runtime/rune-mobile-web/package-lock.json
      - run: npm ci && npm run build
        working-directory: runtime/rune-web
      - run: cargo test --test mobile_web_cli --test html_output_cli
      - run: npm ci && npm test && npm run build && npx cap sync
        working-directory: runtime/rune-mobile-web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium webkit
      - run: python tests/browser/rune_mobile_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: rune-mobile-web-bundle
          path: runtime/rune-mobile-web/www/

  android:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm run build
        working-directory: runtime/rune-web
      - run: cargo run -- examples/rune_mobile_web --build android --build-dir "${{ runner.temp }}/rune-mobile-web-android"
      - uses: actions/upload-artifact@v4
        with:
          name: rune-mobile-web-android-debug
          path: ${{ runner.temp }}/rune-mobile-web-android/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
        working-directory: runtime/rune-web
      - run: cargo run -- examples/rune_mobile_web --build ios --build-dir "${{ runner.temp }}/rune-mobile-web-ios"
      - run: ditto -c -k --sequesterRsrc --keepParent "${{ runner.temp }}/rune-mobile-web-ios/build/ios/Build/Products/Debug-iphonesimulator/App.app" "${{ runner.temp }}/rune-mobile-web-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rune-mobile-web-ios-simulator
          path: ${{ runner.temp }}/rune-mobile-web-ios-simulator.zip
