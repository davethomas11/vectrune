name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: vectrune
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: vectrune
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: vectrune
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            bin: vectrune
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: vectrune
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bin: vectrune
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: vectrune.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build rune-web runtime
        working-directory: runtime/rune-web
        run: |
          npm install
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Zig is a great cross-linker that handles ARM/Linux perfectly
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        # We use zigbuild for Linux targets to handle cross-linking
        # MacOS and Windows can usually stay on standard cargo
        run: |
          if [[ "${{ matrix.platform.target }}" == *"linux"* ]]; then
            cargo zigbuild --release --target ${{ matrix.platform.target }}
          else
            cargo build --release --target ${{ matrix.platform.target }}
          fi
        shell: bash

      - name: Verify native release binaries
        if: matrix.platform.name != 'linux-arm64' && matrix.platform.name != 'linux-armv7'
        shell: bash
        run: |
          BIN="target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}"
          "$BIN" --version
          "$BIN" test examples/rune_studio --json
          "$BIN" test examples/vect_breach --type logic --json

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czf ../../../${{ matrix.platform.bin }}-${{ matrix.platform.name }}.tar.gz ${{ matrix.platform.bin }}
          cd -

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.bin }}-${{ matrix.platform.name }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          tag_name: ${{ inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-tap:
    name: Notify Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Notify homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" '{event_type:"vectrune-release",client_payload:{tag:$tag}}' > "$RUNNER_TEMP/tap-release.json"
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            https://api.github.com/repos/davethomas11/homebrew-vectrune/dispatches \
            --data-binary "@$RUNNER_TEMP/tap-release.json"
