name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: vectrune
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: vectrune
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: vectrune
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            bin: vectrune
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: vectrune
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bin: vectrune
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: vectrune.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build rune-web runtime
        working-directory: runtime/rune-web
        run: |
          npm install
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Zig is a great cross-linker that handles ARM/Linux perfectly
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build Linux audio dependency
        if: contains(matrix.platform.target, 'linux')
        run: bash .github/scripts/build-linux-audio.sh "${{ matrix.platform.target }}"

      - name: Build
        # We use zigbuild for Linux targets to handle cross-linking
        # MacOS and Windows can usually stay on standard cargo
        run: |
          if [[ "${{ matrix.platform.target }}" == *"linux"* ]]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_LIBDIR="$PWD/target/linux-audio/${{ matrix.platform.target }}/install/lib/pkgconfig"
            cargo zigbuild --release --target ${{ matrix.platform.target }}
          else
            cargo build --release --target ${{ matrix.platform.target }}
          fi
        shell: bash

      - name: Verify native release binaries
        if: matrix.platform.name != 'linux-arm64' && matrix.platform.name != 'linux-armv7'
        shell: bash
        run: |
          BIN="target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}"
          if [[ "${{ matrix.platform.target }}" == *"linux"* ]]; then
            "target/linux-audio/${{ matrix.platform.target }}/audio-backend-check"
          fi
          "$BIN" --version
          "$BIN" ascii run examples/ascii/borrowed_morning.rune --plain --frames 2 --commands begin --commands look
          "$BIN" examples/data/storage/checkout.vect
          "$BIN" examples/data/storage/replay.vect
          "$BIN" test examples/language/objects --json
          "$BIN" test examples/rune-web/studio --json
          "$BIN" test examples/games/vect_breach --type logic --json
          "$BIN" test examples/games/rune_crypt --type logic --json
          "$BIN" test examples/games/skybound --type logic --json
          "$BIN" test examples/games/skybound_2 --type logic --timeout 60 --json
          "$BIN" test examples/games/starfall --type logic --timeout 60 --json

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czf ../../../${{ matrix.platform.bin }}-${{ matrix.platform.name }}.tar.gz ${{ matrix.platform.bin }}
          cd -
          if [[ "${{ matrix.platform.target }}" == *"linux"* ]]; then
            mkdir -p audio-notices/licenses
            cp "target/linux-audio/${{ matrix.platform.target }}/alsa-lib-1.2.14/COPYING" audio-notices/licenses/ALSA-LICENSE
            cp docs/native-audio-builds.md audio-notices/licenses/
            archive="${{ matrix.platform.bin }}-${{ matrix.platform.name }}.tar"
            gzip -d "$archive.gz"
            tar --append --file="$archive" -C audio-notices licenses
            gzip -n "$archive"
          fi

      - name: Package Linux audio rebuild sources
        if: matrix.platform.name == 'linux-x86_64'
        shell: bash
        run: |
          mkdir -p audio-source
          git archive --format=tar HEAD -o audio-source/vectrune-source.tar
          cp Cargo.lock audio-source/
          cp target/linux-audio/x86_64-unknown-linux-gnu/alsa-lib-1.2.14.tar.bz2 audio-source/
          cp target/linux-audio/x86_64-unknown-linux-gnu/alsa-lib-1.2.14/COPYING audio-source/ALSA-LICENSE
          cp docs/native-audio-builds.md audio-source/README.md
          (cd audio-source && zip -q -r ../vectrune-audio-source.zip .)

      - name: Upload Linux audio rebuild sources
        if: matrix.platform.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: native-audio-source
          path: vectrune-audio-source.zip
          if-no-files-found: error

      - name: Generate offline manuals
        if: matrix.platform.name == 'linux-x86_64'
        run: python3 teaching_website/build_man_pages.py --binary target/x86_64-unknown-linux-gnu/release/vectrune --output dist/manuals/man

      - name: Upload offline manuals
        if: matrix.platform.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: offline-manuals
          path: dist/manuals/
          if-no-files-found: error

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.bin }}-${{ matrix.platform.name }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Bundle offline manuals with every platform
        run: |
          test -s artifacts/man/man1/vectrune.1
          test -s artifacts/man/man7/vectrune-language.7
          for archive in artifacts/*.tar.gz; do
            gzip -d "$archive"
            tar --append --file="${archive%.gz}" -C artifacts man
            gzip -n "${archive%.gz}"
            tar -tzf "$archive" | grep -Fx 'man/man1/vectrune.1'
            tar -tzf "$archive" | grep -Fx 'man/man7/vectrune-language.7'
          done

      - name: Locate release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -f teaching_website/release.json ]; then
            python3 teaching_website/release_metadata.py --tag "$RELEASE_TAG"
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"; fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/vectrune-audio-source.zip
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-tap:
    name: Notify Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Notify homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" '{event_type:"vectrune-release",client_payload:{tag:$tag}}' > "$RUNNER_TEMP/tap-release.json"
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            https://api.github.com/repos/davethomas11/homebrew-vectrune/dispatches \
            --data-binary "@$RUNNER_TEMP/tap-release.json"
