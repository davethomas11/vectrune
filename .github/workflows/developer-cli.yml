name: Developer CLI checks

on:
  push:
    branches: [main, 'release/**', 'feature/pixel-*']
    paths:
      - 'runtime/rune-web/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/testing/**'
      - 'examples/rune-web/studio/**'
      - 'examples/games/monster_city/**'
      - 'examples/games/vect_breach/**'
      - 'examples/games/idle_aquarium/**'
      - 'examples/games/rune_crypt/**'
      - 'examples/games/starfall/**'
      - 'examples/games/marble_run/**'
      - 'teaching_website/build_developer_starter.py'
      - 'teaching_website/build_man_pages.py'
      - 'teaching_website/release.json'
      - 'teaching_website/release_metadata.py'
      - 'teaching_website/parts/release.generated.rune'
      - 'docs/releases/**'
      - 'tests/browser/test_teaching_build.py'
      - 'teaching_website/generate_man_pages.vect'
      - 'teaching_website/reference_inventory.py'
      - 'knowledge/reference/library.json'
      - '.github/workflows/release.yml'
      - 'teaching_website/content/developer/**'
      - 'Cargo.toml'
      - '.github/workflows/developer-cli.yml'
  pull_request:
    paths:
      - 'runtime/rune-web/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/testing/**'
      - 'examples/rune-web/studio/**'
      - 'examples/games/monster_city/**'
      - 'examples/games/vect_breach/**'
      - 'examples/games/idle_aquarium/**'
      - 'examples/games/rune_crypt/**'
      - 'examples/games/starfall/**'
      - 'examples/games/marble_run/**'
      - 'teaching_website/build_developer_starter.py'
      - 'teaching_website/build_man_pages.py'
      - 'teaching_website/release.json'
      - 'teaching_website/release_metadata.py'
      - 'teaching_website/parts/release.generated.rune'
      - 'docs/releases/**'
      - 'tests/browser/test_teaching_build.py'
      - 'teaching_website/generate_man_pages.vect'
      - 'teaching_website/reference_inventory.py'
      - 'knowledge/reference/library.json'
      - '.github/workflows/release.yml'
      - 'teaching_website/content/developer/**'
      - 'Cargo.toml'
      - '.github/workflows/developer-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/rune-web/package-lock.json
      - name: Build and test shared JavaScript runtimes
        shell: bash
        working-directory: runtime/rune-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Check compiler
        run: cargo check
      - name: Check browser emulator
        shell: bash
        working-directory: runtime/rune-emulator
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Test CLI and runtime integration
        run: cargo test --test borrowed_morning --test ascii_generation --test ascii_animator --test ascii3d --test developer_cli --test logic_testing --test pixel_app --test game_controls --test integration_app --test arithmetic_assignment_test --test parser_object_assignment_regression --test imports_test --test conditional_in_series_test --test lambda_package --test pixel3d_app --test pixel3d_parity --test pixel3d_enhanced_parity --test pixel3d_shapes --test marble_run_app --test integration_vect_cli --test integration_vectrune_cli --test music_arrangement --test skybound_app --test skybound_2_app --test starfall_app --test object_syntax_parity --test fetch_builtin --test storage_core --test storage_network --test multi_app_cli
      - name: Test CLI support and deployment packaging
        run: 'cargo test --lib cli::'
      - name: Test pixel audio and persistence without an output device
        run: |
          cargo test --lib apps::pixel::
          cargo test --lib apps::game_controls
          cargo test --lib apps::pixel3d::voxel::tests
      - name: Check starter formatting
        run: target/debug/vectrune fmt examples/testing --check
      - name: Lint example suite
        run: target/debug/vectrune check examples/testing --deny-warnings
      - name: Run tests written in Rune
        run: target/debug/vectrune test examples/testing --json
      - name: Lint Rune Studio
        run: target/debug/vectrune check examples/rune-web/studio --deny-warnings
      - name: Check Studio test formatting
        run: target/debug/vectrune fmt examples/rune-web/studio/studio.test.rune --check
      - name: Run Rune Studio native and logic tests
        run: target/debug/vectrune test examples/rune-web/studio --json
      - name: Verify downloaded starter workflow
        run: python tests/browser/test_developer_starter.py
      - name: Verify offline manual generation
        run: python tests/browser/test_man_pages.py
      - name: Verify website release metadata
        if: runner.os == 'Linux'
        run: python3 tests/browser/test_teaching_build.py
      - name: Lint Monster City and run pixel game tests
        run: |
          target/debug/vectrune check examples/games/monster_city --deny-warnings
          target/debug/vectrune fmt examples/games/monster_city --check
          target/debug/vectrune test examples/games/monster_city --json
      - name: Test Vect Breach game logic
        run: target/debug/vectrune test examples/games/vect_breach --type logic --json
      - name: Test Rune Crypt game logic
        run: |
          target/debug/vectrune fmt examples/games/rune_crypt --check
          target/debug/vectrune test examples/games/rune_crypt --type logic --json
      - name: Install Linux native input and audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Check optional desktop pixel host
        run: cargo check --features pixel-desktop

      - name: Test Skybound adventures
        run: |
          target/debug/vectrune fmt examples/games/skybound --check
          target/debug/vectrune fmt examples/games/skybound_2 --check
          target/debug/vectrune test examples/games/skybound --type logic --json
          target/debug/vectrune test examples/games/skybound_2 --type logic --timeout 60 --json

      - name: Test Starfall Protocol
        run: target/debug/vectrune test examples/games/starfall --type logic --timeout 60 --json

      - name: Test Marble Run
        run: |
          target/debug/vectrune fmt examples/games/marble_run --check
          target/debug/vectrune check examples/games/marble_run --deny-warnings
          target/debug/vectrune test examples/games/marble_run --type logic --json
