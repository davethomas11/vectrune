name: Developer CLI checks

on:
  push:
    branches: [main, 'release/**', 'feature/pixel-*']
    paths:
      - 'runtime/rune-web/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/testing/**'
      - 'examples/rune_studio/**'
      - 'examples/monster_city/**'
      - 'teaching_website/build_developer_starter.py'
      - 'teaching_website/content/developer/**'
      - 'Cargo.toml'
      - '.github/workflows/developer-cli.yml'
  pull_request:
    paths:
      - 'runtime/rune-web/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/testing/**'
      - 'examples/rune_studio/**'
      - 'examples/monster_city/**'
      - 'teaching_website/build_developer_starter.py'
      - 'teaching_website/content/developer/**'
      - 'Cargo.toml'
      - '.github/workflows/developer-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/rune-web/package-lock.json
      - name: Build and test shared JavaScript runtimes
        working-directory: runtime/rune-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Check compiler
        run: cargo check
      - name: Test CLI and runtime integration
        run: cargo test --test developer_cli --test logic_testing --test pixel_app --test integration_app --test arithmetic_assignment_test --test parser_object_assignment_regression --test imports_test --test conditional_in_series_test --test lambda_package
      - name: Test CLI support and deployment packaging
        run: 'cargo test --lib cli::'
      - name: Check starter formatting
        run: target/debug/vectrune fmt examples/testing --check
      - name: Lint example suite
        run: target/debug/vectrune check examples/testing --deny-warnings
      - name: Run tests written in Rune
        run: target/debug/vectrune test examples/testing --json
      - name: Lint Rune Studio
        run: target/debug/vectrune check examples/rune_studio --deny-warnings
      - name: Check Studio test formatting
        run: target/debug/vectrune fmt examples/rune_studio/studio.test.rune --check
      - name: Run Rune Studio native and logic tests
        run: target/debug/vectrune test examples/rune_studio --json
      - name: Verify downloaded starter workflow
        run: python tests/browser/test_developer_starter.py
      - name: Lint Monster City and run pixel game tests
        run: |
          target/debug/vectrune check examples/monster_city --deny-warnings
          target/debug/vectrune fmt examples/monster_city --check
          target/debug/vectrune test examples/monster_city --json
      - name: Check optional desktop pixel host
        run: cargo check --features pixel-desktop
